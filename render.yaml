services:
  - type: web
    name: localspin-ai-saas
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: PORT
        value: 3456
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
